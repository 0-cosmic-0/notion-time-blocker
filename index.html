<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notion Time Blocker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Inter font to match Notion -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #F0EFED;
      --bg-panel: #E4E2DE;
      --bg-grid: #FFFFFF;
      --accent: #2E7CD1;
      --accent-soft: #233850;
      --text-main: #191919;
      --text-muted: #555555;
      --event-bg: #2E7CD1;
      --event-text: #FFFFFF;

      --border-subtle: #D0CEC8;
      --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.08);

      --hour-label-width: 60px;
      --top-bar-height: 52px;
      --right-panel-width: 280px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .app-root {
      width: 100%;
      max-width: 100%;
      height: 100vh;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-bar {
      height: var(--top-bar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-panel);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-subtle);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .template-title {
      font-weight: 600;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .template-title[contenteditable="true"] {
      outline: none;
      border-bottom: 1px dashed transparent;
    }

    .template-title[contenteditable="true"]:focus {
      border-bottom-color: var(--accent);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .current-time-label {
      font-weight: 500;
      color: var(--accent-soft);
    }

    .current-event-label {
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-button {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-grid);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-muted);
    }

    .menu-button:hover {
      background: var(--bg-panel);
    }

    .main-layout {
      flex: 1;
      display: flex;
      gap: 8px;
      min-height: 0;
    }

    .schedule-container {
      flex: 1;
      min-width: 0;
      background: var(--bg-grid);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .schedule-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(0,0,0,0.01);
      font-size: 12px;
      color: var(--text-muted);
    }

    .schedule-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-early {
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-panel);
      cursor: pointer;
      font-size: 11px;
      color: var(--text-muted);
    }

    .toggle-early.active {
      border-color: var(--accent);
      color: var(--accent-soft);
    }

    .schedule-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .add-event-btn {
      padding: 4px 10px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .add-event-btn:hover {
      background: #2569ad;
    }

    .schedule-body {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }

    .hour-labels {
      width: var(--hour-label-width);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .hour-label {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 2px 6px 0 2px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .hour-label.hidden-hour {
      display: none;
    }

    .grid-wrapper {
      flex: 1;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg-grid);
    }

    .grid-hours {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    .grid-hour {
      flex: 1;
    }

    .event-layer {
      position: relative;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    .event-block {
      position: absolute;
      left: 4px;
      right: 4px;
      border-radius: 4px;
      background: var(--event-bg);
      color: var(--event-text);
      padding: 2px 6px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      cursor: grab;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      margin: 1px 0;
    }

    .event-block.locked {
      opacity: 0.85;
      cursor: default;
    }

    .event-inner-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 4px;
      width: 100%;
    }

    .event-title {
      font-weight: 600;
      font-size: 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      order: 1;
    }

    .event-time {
      font-weight: 500;
      font-size: 10px;
      text-align: right;
      order: 2;
      white-space: nowrap;
    }

    .event-lock-icon {
      position: absolute;
      top: 2px;
      left: 2px;
      font-size: 10px;
      opacity: 0.8;
    }

    .event-overlaying {
      outline: 1px dashed rgba(255,255,255,0.8);
      outline-offset: -2px;
    }

    .event-block:hover {
      filter: brightness(1.05);
    }

    .event-block[data-description]:hover::after {
      content: attr(data-description);
      position: absolute;
      left: 0;
      top: 100%;
      margin-top: 4px;
      max-width: 260px;
      background: #111;
      color: #fff;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 10px;
      white-space: normal;
      z-index: 20;
    }

    .right-panel {
      width: var(--right-panel-width);
      background: var(--bg-panel);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
      min-width: 0;
      transition: width 0.2s ease, margin 0.2s ease, opacity 0.2s ease, padding 0.2s ease, border 0.2s ease;
    }

    .right-panel.collapsed {
      width: 0;
      padding: 0;
      margin: 0;
      border: none;
      opacity: 0;
      pointer-events: none;
    }

    .right-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .template-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 160px;
      overflow-y: auto;
    }

    .template-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      border-radius: 6px;
      background: var(--bg-grid);
      cursor: pointer;
      font-size: 12px;
      border: 1px solid transparent;
    }

    .template-item.active {
      border-color: var(--accent);
      background: #dde9f7;
    }

    .template-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .template-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 4px;
    }

    .template-delete {
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
    }

    .template-delete:hover {
      color: #b00020;
    }

    .add-template-btn {
      margin-top: 4px;
      width: 100%;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px dashed var(--border-subtle);
      background: transparent;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .add-template-btn:hover {
      border-style: solid;
      color: var(--accent-soft);
    }

    .theme-controls,
    .alarm-controls {
      padding: 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.4);
      border: 1px solid var(--border-subtle);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .theme-row,
    .alarm-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .theme-row label,
    .alarm-row label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .color-input {
      width: 70px;
      height: 22px;
      padding: 0;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      background: #fff;
    }

    .preset-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preset-select {
      width: 100%;
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      background: #fff;
      font-family: inherit;
    }

    .alarm-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    .alarm-toggle input {
      cursor: pointer;
    }

    .alarm-select,
    .alarm-volume {
      font-size: 11px;
    }

    .alarm-volume {
      width: 100px;
    }

    .alarm-status {
      font-size: 10px;
      color: var(--text-muted);
      min-height: 12px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .modal {
      width: 320px;
      max-width: 90vw;
      background: var(--bg-grid);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      border: 1px solid var(--border-subtle);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }

    .modal-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .modal-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .modal-row label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .modal-row input,
    .modal-row textarea,
    .modal-row select {
      font-family: inherit;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      background: #fff;
    }

    .modal-row textarea {
      resize: vertical;
      min-height: 50px;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .modal-left-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-right-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-panel);
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .btn-danger {
      border-color: #b00020;
      color: #b00020;
      background: #fff;
    }

    .btn:hover {
      filter: brightness(0.97);
    }

    .lock-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }

    @media (max-width: 900px) {
      .main-layout {
        flex-direction: column;
      }
      .right-panel {
        width: 100%;
      }
      .right-panel.collapsed {
        width: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app-root">
    <div class="top-bar">
      <div class="top-left">
        <div id="templateTitle" class="template-title" contenteditable="true"></div>
      </div>
      <div class="top-right">
        <div class="current-time-label" id="currentTimeLabel">--:--</div>
        <div class="current-event-label" id="currentEventLabel">No current event</div>
        <button class="menu-button" id="menuToggleBtn" title="Templates, themes, alarms">⋯</button>
      </div>
    </div>

    <div class="main-layout">
      <div class="schedule-container">
        <div class="schedule-header">
          <div class="schedule-header-left">
            <span>Daily Time Blocker</span>
            <button class="toggle-early" id="toggleEarlyBtn">Show 00:00–06:00 & 23:00–24:00</button>
          </div>
          <div class="schedule-header-right">
            <button class="add-event-btn" id="addEventBtn">Add Event</button>
          </div>
        </div>
        <div class="schedule-body">
          <div class="hour-labels" id="hourLabels"></div>
          <div class="grid-wrapper" id="gridWrapper">
            <div class="grid-hours" id="gridHours"></div>
            <div class="event-layer" id="eventLayer"></div>
          </div>
        </div>
      </div>

      <div class="right-panel collapsed" id="rightPanel">
        <div>
          <div class="right-section-title">Templates</div>
          <div class="template-list" id="templateList"></div>
          <button class="add-template-btn" id="addTemplateBtn">+ Add Template</button>
        </div>

        <div class="theme-controls">
          <div class="right-section-title">Theme</div>
          <div class="theme-row">
            <label>Background</label>
            <input type="color" id="bgColorInput" class="color-input" />
          </div>
          <div class="theme-row">
            <label>Grid / Panels</label>
            <input type="color" id="panelColorInput" class="color-input" />
          </div>
          <div class="theme-row">
            <label>Accent</label>
            <input type="color" id="accentColorInput" class="color-input" />
          </div>
          <div class="theme-row">
            <label>Event Background</label>
            <input type="color" id="eventBgColorInput" class="color-input" />
          </div>
          <div class="theme-row">
            <label>Event Text</label>
            <input type="color" id="eventTextColorInput" class="color-input" />
          </div>
          <div class="theme-row">
            <label>General Text</label>
            <input type="color" id="textColorInput" class="color-input" />
          </div>
          <div class="preset-row">
            <label for="presetSelect">Presets</label>
            <select id="presetSelect" class="preset-select">
              <option value="">Select preset…</option>
              <option value="notion">Notion Summer</option>
              <option value="dark">Dark Focus</option>
              <option value="pastel">Soft Pastel</option>
              <option value="midnight">Midnight Blue</option>
              <option value="forest">Forest Calm</option>
              <option value="rosewater">Rosewater</option>
              <option value="solar-light">Solarized Light</option>
              <option value="solar-dark">Solarized Dark</option>
            </select>
          </div>
        </div>

        <div class="alarm-controls">
          <div class="right-section-title">Alarms</div>
          <div class="alarm-row">
            <div class="alarm-toggle">
              <input type="checkbox" id="alarmToggle" />
              <label for="alarmToggle">Enable alarms</label>
            </div>
          </div>
          <div class="alarm-row">
            <label>Sound</label>
            <select id="alarmSoundSelect" class="alarm-select">
              <option value="chime">Soft Chime</option>
              <option value="bell">Bell</option>
              <option value="ping">Ping</option>
            </select>
          </div>
          <div class="alarm-row">
            <label>Volume</label>
            <input type="range" id="alarmVolume" class="alarm-volume" min="0" max="1" step="0.05" value="0.7" />
          </div>
          <div class="alarm-status" id="alarmStatus"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- EVENT MODAL -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-title" id="modalTitle">Edit Event</div>
      <div class="modal-row">
        <label for="eventTitleInput">Title</label>
        <input type="text" id="eventTitleInput" />
      </div>
      <div class="modal-row">
        <label for="eventStartInput">Start (HH:MM)</label>
        <input type="time" id="eventStartInput" step="300" />
      </div>
      <div class="modal-row">
        <label for="eventEndInput">End (HH:MM)</label>
        <input type="time" id="eventEndInput" step="300" />
      </div>
      <div class="modal-row">
        <label for="eventDescriptionInput">Description</label>
        <textarea id="eventDescriptionInput"></textarea>
      </div>
      <div class="modal-row">
        <label class="lock-toggle">
          <input type="checkbox" id="eventLockedInput" />
          Lock event (cannot be moved)
        </label>
      </div>
      <div class="modal-footer">
        <div class="modal-left-actions">
          <button class="btn btn-danger" id="deleteEventBtn">Delete</button>
        </div>
        <div class="modal-right-actions">
          <button class="btn" id="cancelEventBtn">Cancel</button>
          <button class="btn btn-primary" id="saveEventBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TEMPLATE MODAL -->
  <div class="modal-backdrop" id="templateModalBackdrop">
    <div class="modal">
      <div class="modal-title">Edit Template</div>
      <div class="modal-row">
        <label for="templateNameInput">Template Name</label>
        <input type="text" id="templateNameInput" />
      </div>
      <div class="modal-footer">
        <div class="modal-left-actions">
          <button class="btn" id="duplicateTemplateBtn">Duplicate</button>
          <button class="btn btn-danger" id="deleteTemplateConfirmBtn">Delete</button>
        </div>
        <div class="modal-right-actions">
          <button class="btn" id="cancelTemplateBtn">Cancel</button>
          <button class="btn btn-primary" id="saveTemplateBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "notion-time-blocker-v2";

    const defaultTemplates = [
      {
        id: "default-summer",
        name: "Default Summer Routine",
        events: [
          { id: "e1", title: "Arise & Morning Routine", startMinutes: 6 * 60, endMinutes: 8 * 60, description: "Water, meditate, plan, stretch", locked: false },
          { id: "e2", title: "Reading", startMinutes: 8 * 60, endMinutes: 8 * 60 + 30, description: "Book or Khan Academy reading", locked: false },
          { id: "e3", title: "Algebra 2", startMinutes: 9 * 60 + 30, endMinutes: 12 * 60, description: "Khan Academy + notes", locked: false },
          { id: "e4", title: "Lunch & Break", startMinutes: 12 * 60, endMinutes: 13 * 60 + 30, description: "Rest + food", locked: false },
          { id: "e5", title: "Study Hall Topic 1", startMinutes: 13 * 60 + 30, endMinutes: 15 * 60, description: "", locked: false },
          { id: "e6", title: "Study Hall Topic 2", startMinutes: 15 * 60, endMinutes: 16 * 60 + 30, description: "", locked: false },
          { id: "e7", title: "Piano", startMinutes: 16 * 60 + 30, endMinutes: 17 * 60, description: "", locked: false },
          { id: "e8", title: "Workout", startMinutes: 18 * 60, endMinutes: 19 * 60, description: "", locked: false },
          { id: "e9", title: "Break", startMinutes: 19 * 60 + 30, endMinutes: 21 * 60, description: "", locked: false },
          { id: "e10", title: "Wind Down", startMinutes: 21 * 60, endMinutes: 21 * 60 + 30, description: "", locked: false },
          { id: "e11", title: "Sleep", startMinutes: 21 * 60 + 30, endMinutes: 24 * 60 + 6 * 60, description: "", locked: true }
        ]
      }
    ];

    const defaultTheme = {
      bgMain: "#F0EFED",
      bgPanel: "#E4E2DE",
      bgGrid: "#FFFFFF",
      accent: "#2E7CD1",
      eventBg: "#2E7CD1",
      eventText: "#FFFFFF",
      textMain: "#191919"
    };

    const themePresets = {
      notion: {
        bgMain: "#F0EFED",
        bgPanel: "#E4E2DE",
        bgGrid: "#FFFFFF",
        accent: "#2E7CD1",
        eventBg: "#2E7CD1",
        eventText: "#FFFFFF",
        textMain: "#191919"
      },
      dark: {
        bgMain: "#191919",
        bgPanel: "#262626",
        bgGrid: "#233850",
        accent: "#2E7CD1",
        eventBg: "#2E7CD1",
        eventText: "#FFFFFF",
        textMain: "#F0EFED"
      },
      pastel: {
        bgMain: "#FDF6F0",
        bgPanel: "#F4E3FF",
        bgGrid: "#FFFFFF",
        accent: "#FF9AA2",
        eventBg: "#FFB7B2",
        eventText: "#4A4A4A",
        textMain: "#333333"
      },
      midnight: {
        bgMain: "#0B1020",
        bgPanel: "#151B30",
        bgGrid: "#1E2640",
        accent: "#4C8DFF",
        eventBg: "#4C8DFF",
        eventText: "#FFFFFF",
        textMain: "#E5ECFF"
      },
      forest: {
        bgMain: "#F3F7F4",
        bgPanel: "#DDE8E0",
        bgGrid: "#FFFFFF",
        accent: "#3A6B4F",
        eventBg: "#4F8A5B",
        eventText: "#FFFFFF",
        textMain: "#1F2E24"
      },
      rosewater: {
        bgMain: "#FFF7F9",
        bgPanel: "#FBE0E8",
        bgGrid: "#FFFFFF",
        accent: "#E58CA5",
        eventBg: "#F2A7BC",
        eventText: "#4A2A33",
        textMain: "#3A2A2F"
      },
      "solar-light": {
        bgMain: "#FDF6E3",
        bgPanel: "#EEE8D5",
        bgGrid: "#FFFFFF",
        accent: "#268BD2",
        eventBg: "#2AA198",
        eventText: "#073642",
        textMain: "#586E75"
      },
      "solar-dark": {
        bgMain: "#002B36",
        bgPanel: "#073642",
        bgGrid: "#00212B",
        accent: "#268BD2",
        eventBg: "#2AA198",
        eventText: "#FDF6E3",
        textMain: "#EEE8D5"
      }
    };

    let state = {
      templates: [],
      currentTemplateId: null,
      theme: { ...defaultTheme },
      showEarly: false,
      alarmsEnabled: false,
      alarmSound: "chime",
      alarmVolume: 0.7
    };

    let dragState = null;
    let editingEventId = null;

    function getShareKey() {
      return window.location.pathname + window.location.search;
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        state.templates = JSON.parse(JSON.stringify(defaultTemplates));
        state.currentTemplateId = state.templates[0].id;
        state.theme = { ...defaultTheme };
        return;
      }
      try {
        const all = JSON.parse(raw);
        const key = getShareKey();
        if (!all[key]) {
          state.templates = JSON.parse(JSON.stringify(defaultTemplates));
          state.currentTemplateId = state.templates[0].id;
          state.theme = { ...defaultTheme };
        } else {
          const saved = all[key];
          state.templates = saved.templates || JSON.parse(JSON.stringify(defaultTemplates));
          state.currentTemplateId = saved.currentTemplateId || (state.templates[0] && state.templates[0].id);
          state.theme = saved.theme || { ...defaultTheme };
          state.showEarly = !!saved.showEarly;
          state.alarmsEnabled = !!saved.alarmsEnabled;
          state.alarmSound = saved.alarmSound || "chime";
          state.alarmVolume = typeof saved.alarmVolume === "number" ? saved.alarmVolume : 0.7;
        }
      } catch (e) {
        console.error("Failed to parse state", e);
        state.templates = JSON.parse(JSON.stringify(defaultTemplates));
        state.currentTemplateId = state.templates[0].id;
        state.theme = { ...defaultTheme };
      }
    }

    function saveState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      let all = {};
      if (raw) {
        try {
          all = JSON.parse(raw);
        } catch {
          all = {};
        }
      }
      const key = getShareKey();
      all[key] = {
        templates: state.templates,
        currentTemplateId: state.currentTemplateId,
        theme: state.theme,
        showEarly: state.showEarly,
        alarmsEnabled: state.alarmsEnabled,
        alarmSound: state.alarmSound,
        alarmVolume: state.alarmVolume
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    }

    function minutesToTimeStr(m) {
      const total = ((m % (24 * 60)) + (24 * 60)) % (24 * 60);
      const h = Math.floor(total / 60);
      const mm = total % 60;
      return `${String(h).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
    }

    function clampTo5Minutes(m) {
      return Math.round(m / 5) * 5;
    }

    function getCurrentTemplate() {
      return state.templates.find(t => t.id === state.currentTemplateId) || state.templates[0];
    }

    function generateId(prefix) {
      return prefix + "_" + Math.random().toString(36).slice(2, 9);
    }

    function applyTheme() {
      const root = document.documentElement;
      root.style.setProperty("--bg-main", state.theme.bgMain);
      root.style.setProperty("--bg-panel", state.theme.bgPanel);
      root.style.setProperty("--bg-grid", state.theme.bgGrid);
      root.style.setProperty("--accent", state.theme.accent);
      root.style.setProperty("--accent-soft", state.theme.accent);
      root.style.setProperty("--event-bg", state.theme.eventBg);
      root.style.setProperty("--event-text", state.theme.eventText);
      root.style.setProperty("--text-main", state.theme.textMain);
      root.style.setProperty("--text-muted", state.theme.textMain + "CC");

      document.getElementById("bgColorInput").value = state.theme.bgMain;
      document.getElementById("panelColorInput").value = state.theme.bgPanel;
      document.getElementById("accentColorInput").value = state.theme.accent;
      document.getElementById("eventBgColorInput").value = state.theme.eventBg;
      document.getElementById("eventTextColorInput").value = state.theme.eventText;
      document.getElementById("textColorInput").value = state.theme.textMain;
    }

    const hourLabelsEl = document.getElementById("hourLabels");
    const gridHoursEl = document.getElementById("gridHours");
    const eventLayerEl = document.getElementById("eventLayer");
    const gridWrapperEl = document.getElementById("gridWrapper");

    const HOURS_IN_DAY = 24;
    const MINUTES_IN_DAY = 24 * 60;

    function renderHours() {
      hourLabelsEl.innerHTML = "";
      gridHoursEl.innerHTML = "";

      for (let h = 0; h < HOURS_IN_DAY; h++) {
        const label = document.createElement("div");
        label.className = "hour-label";
        if (!state.showEarly && (h < 6 || h >= 23)) {
          label.classList.add("hidden-hour");
        }
        label.textContent = `${String(h).padStart(2, "0")}:00`;
        hourLabelsEl.appendChild(label);

        const hourDiv = document.createElement("div");
        hourDiv.className = "grid-hour";
        if (!state.showEarly && (h < 6 || h >= 23)) {
          hourDiv.style.display = "none";
        }
        gridHoursEl.appendChild(hourDiv);
      }

      requestAnimationFrame(() => {
        const totalHeight = gridHoursEl.getBoundingClientRect().height;
        const hourHeight = totalHeight / HOURS_IN_DAY;
        const scrollStartHour = state.showEarly ? 0 : 6;
        gridWrapperEl.scrollTop = scrollStartHour * hourHeight;
      });
    }

    function minutesToTopOffset(m) {
      const totalHeight = gridHoursEl.getBoundingClientRect().height || 1;
      return (m / MINUTES_IN_DAY) * totalHeight;
    }

    function minutesToHeight(start, end) {
      const totalHeight = gridHoursEl.getBoundingClientRect().height || 1;
      const duration = end - start;
      return (duration / MINUTES_IN_DAY) * totalHeight;
    }

    function eventsOverlap(e1, e2) {
      return e1.startMinutes < e2.endMinutes && e2.startMinutes < e1.endMinutes;
    }

    function renderEvents() {
      eventLayerEl.innerHTML = "";
      const template = getCurrentTemplate();
      if (!template) return;

      const events = [...template.events].sort((a, b) => a.startMinutes - b.startMinutes);

      for (const ev of events) {
        const block = document.createElement("div");
        block.className = "event-block";
        if (ev.locked) block.classList.add("locked");

        const top = minutesToTopOffset(ev.startMinutes);
        const height = Math.max(18, minutesToHeight(ev.startMinutes, ev.endMinutes));

        block.style.top = top + "px";
        block.style.height = height + "px";

        const overlapping = events.some(other => other.id !== ev.id && eventsOverlap(ev, other));
        if (overlapping) {
          block.classList.add("event-overlaying");
        }

        block.dataset.id = ev.id;
        block.dataset.description = ev.description || "";

        const innerRow = document.createElement("div");
        innerRow.className = "event-inner-row";

        const titleEl = document.createElement("div");
        titleEl.className = "event-title";
        titleEl.textContent = ev.title || "(Untitled)";

        const timeEl = document.createElement("div");
        timeEl.className = "event-time";
        timeEl.textContent = `${minutesToTimeStr(ev.startMinutes)}–${minutesToTimeStr(ev.endMinutes)}`;

        innerRow.appendChild(titleEl);
        innerRow.appendChild(timeEl);
        block.appendChild(innerRow);

        const lockIcon = document.createElement("div");
        lockIcon.className = "event-lock-icon";
        lockIcon.textContent = ev.locked ? "🔒" : "";
        block.appendChild(lockIcon);

        block.addEventListener("mousedown", (e) => {
          if (ev.locked) {
            if (e.button === 0) openEventModal(ev.id);
            return;
          }
          if (e.button !== 0) return;
          e.preventDefault();
          startDrag(ev.id, e.clientY);
        });

        block.addEventListener("dblclick", () => {
          openEventModal(ev.id);
        });

        eventLayerEl.appendChild(block);
      }
    }

    function startDrag(eventId, startY) {
      const template = getCurrentTemplate();
      const ev = template.events.find(e => e.id === eventId);
      if (!ev) return;

      const totalHeight = gridHoursEl.getBoundingClientRect().height || 1;
      const pxPerMinute = totalHeight / MINUTES_IN_DAY;

      dragState = {
        eventId,
        startY,
        originalStart: ev.startMinutes,
        originalEnd: ev.endMinutes,
        pxPerMinute
      };

      document.addEventListener("mousemove", onDragMove);
      document.addEventListener("mouseup", onDragEnd);
    }

    function onDragMove(e) {
      if (!dragState) return;
      e.preventDefault();

      const dy = e.clientY - dragState.startY;
      const deltaMinutes = dy / dragState.pxPerMinute;
      const template = getCurrentTemplate();
      const ev = template.events.find(ev => ev.id === dragState.eventId);
      if (!ev) return;

      let newStart = clampTo5Minutes(dragState.originalStart + deltaMinutes);
      let duration = dragState.originalEnd - dragState.originalStart;
      let newEnd = newStart + duration;

      const maxMinutes = 24 * 60 * 2;
      if (newStart < 0) {
        newStart = 0;
        newEnd = duration;
      } else if (newEnd > maxMinutes) {
        newEnd = maxMinutes;
        newStart = maxMinutes - duration;
      }

      ev.startMinutes = newStart;
      ev.endMinutes = newEnd;

      renderEvents();
    }

    function onDragEnd() {
      if (!dragState) return;
      dragState = null;
      document.removeEventListener("mousemove", onDragMove);
      document.removeEventListener("mouseup", onDragEnd);
      saveState();
    }

    const templateListEl = document.getElementById("templateList");
    const templateTitleEl = document.getElementById("templateTitle");

    function renderTemplatesList() {
      templateListEl.innerHTML = "";
      for (const t of state.templates) {
        const item = document.createElement("div");
        item.className = "template-item";
        if (t.id === state.currentTemplateId) item.classList.add("active");

        const nameEl = document.createElement("div");
        nameEl.className = "template-name";
        nameEl.textContent = t.name;

        const actions = document.createElement("div");
        actions.className = "template-actions";

        const delBtn = document.createElement("button");
        delBtn.className = "template-delete";
        delBtn.textContent = "🗑";
        delBtn.title = "Delete template";

        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteTemplate(t.id);
        });

        actions.appendChild(delBtn);

        item.appendChild(nameEl);
        item.appendChild(actions);

        item.addEventListener("click", () => {
          state.currentTemplateId = t.id;
          saveState();
          syncTemplateTitle();
          renderTemplatesList();
          renderEvents();
        });

        item.addEventListener("dblclick", (e) => {
          e.stopPropagation();
          openTemplateModal(t.id);
        });

        templateListEl.appendChild(item);
      }
    }

    function deleteTemplate(id) {
      if (state.templates.length <= 1) {
        alert("You must have at least one template.");
        return;
      }
      const t = state.templates.find(t => t.id === id);
      if (!t) return;
      if (!confirm(`Delete template "${t.name}"?`)) return;

      state.templates = state.templates.filter(t => t.id !== id);
      if (state.currentTemplateId === id) {
        state.currentTemplateId = state.templates[0].id;
      }
      saveState();
      syncTemplateTitle();
      renderTemplatesList();
      renderEvents();
    }

    function addTemplate() {
      const id = generateId("tpl");
      const newTemplate = {
        id,
        name: "New Template",
        events: []
      };
      state.templates.push(newTemplate);
      state.currentTemplateId = id;
      saveState();
      syncTemplateTitle();
      renderTemplatesList();
      renderEvents();
    }

    function syncTemplateTitle() {
      const t = getCurrentTemplate();
      if (!t) return;
      templateTitleEl.textContent = t.name;
    }

    templateTitleEl.addEventListener("blur", () => {
      const t = getCurrentTemplate();
      if (!t) return;
      const newName = templateTitleEl.textContent.trim() || "Untitled Template";
      t.name = newName;
      saveState();
      renderTemplatesList();
    });

    const modalBackdrop = document.getElementById("modalBackdrop");
    const eventTitleInput = document.getElementById("eventTitleInput");
    const eventStartInput = document.getElementById("eventStartInput");
    const eventEndInput = document.getElementById("eventEndInput");
    const eventDescriptionInput = document.getElementById("eventDescriptionInput");
    const eventLockedInput = document.getElementById("eventLockedInput");
    const deleteEventBtn = document.getElementById("deleteEventBtn");
    const cancelEventBtn = document.getElementById("cancelEventBtn");
    const saveEventBtn = document.getElementById("saveEventBtn");

    function openEventModal(eventId = null) {
      const template = getCurrentTemplate();
      editingEventId = eventId;

      if (eventId) {
        const ev = template.events.find(e => e.id === eventId);
        if (!ev) return;
        eventTitleInput.value = ev.title;
        eventStartInput.value = minutesToTimeStr(ev.startMinutes);
        eventEndInput.value = minutesToTimeStr(ev.endMinutes);
        eventDescriptionInput.value = ev.description || "";
        eventLockedInput.checked = !!ev.locked;
        deleteEventBtn.style.display = "inline-flex";
      } else {
        eventTitleInput.value = "";
        eventStartInput.value = "06:00";
        eventEndInput.value = "07:00";
        eventDescriptionInput.value = "";
        eventLockedInput.checked = false;
        deleteEventBtn.style.display = "none";
      }

      modalBackdrop.classList.add("visible");
    }

    function closeEventModal() {
      modalBackdrop.classList.remove("visible");
      editingEventId = null;
    }

    cancelEventBtn.addEventListener("click", closeEventModal);
    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeEventModal();
    });

    deleteEventBtn.addEventListener("click", () => {
      if (!editingEventId) return;
      const template = getCurrentTemplate();
      template.events = template.events.filter(e => e.id !== editingEventId);
      saveState();
      renderEvents();
      closeEventModal();
    });

    saveEventBtn.addEventListener("click", () => {
      const template = getCurrentTemplate();
      if (!template) return;

      const title = eventTitleInput.value.trim() || "Untitled";
      const startStr = eventStartInput.value || "06:00";
      const endStr = eventEndInput.value || "07:00";

      const [sh, sm] = startStr.split(":").map(Number);
      const [eh, em] = endStr.split(":").map(Number);

      let startMinutes = clampTo5Minutes(sh * 60 + sm);
      let endMinutes = clampTo5Minutes(eh * 60 + em);

      if (endMinutes <= startMinutes) {
        endMinutes = startMinutes + 5;
      }

      const description = eventDescriptionInput.value.trim();
      const locked = eventLockedInput.checked;

      if (editingEventId) {
        const ev = template.events.find(e => e.id === editingEventId);
        if (!ev) return;
        ev.title = title;
        ev.startMinutes = startMinutes;
        ev.endMinutes = endMinutes;
        ev.description = description;
        ev.locked = locked;
      } else {
        template.events.push({
          id: generateId("ev"),
          title,
          startMinutes,
          endMinutes,
          description,
          locked
        });
      }

      saveState();
      renderEvents();
      closeEventModal();
    });

    document.getElementById("addEventBtn").addEventListener("click", () => {
      openEventModal(null);
    });

    const toggleEarlyBtn = document.getElementById("toggleEarlyBtn");
    toggleEarlyBtn.addEventListener("click", () => {
      state.showEarly = !state.showEarly;
      toggleEarlyBtn.classList.toggle("active", state.showEarly);
      toggleEarlyBtn.textContent = state.showEarly
        ? "Hide 00:00–06:00 & 23:00–24:00"
        : "Show 00:00–06:00 & 23:00–24:00";
      saveState();
      renderHours();
      renderEvents();
    });

    const rightPanelEl = document.getElementById("rightPanel");
    const menuToggleBtn = document.getElementById("menuToggleBtn");

    menuToggleBtn.addEventListener("click", () => {
      rightPanelEl.classList.toggle("collapsed");
    });

    document.getElementById("bgColorInput").addEventListener("input", (e) => {
      state.theme.bgMain = e.target.value;
      applyTheme();
      saveState();
    });

    document.getElementById("panelColorInput").addEventListener("input", (e) => {
      state.theme.bgPanel = e.target.value;
      applyTheme();
      saveState();
    });

    document.getElementById("accentColorInput").addEventListener("input", (e) => {
      state.theme.accent = e.target.value;
      applyTheme();
      saveState();
    });

    document.getElementById("eventBgColorInput").addEventListener("input", (e) => {
      state.theme.eventBg = e.target.value;
      applyTheme();
      renderEvents();
      saveState();
    });

    document.getElementById("eventTextColorInput").addEventListener("input", (e) => {
      state.theme.eventText = e.target.value;
      applyTheme();
      renderEvents();
      saveState();
    });

    document.getElementById("textColorInput").addEventListener("input", (e) => {
      state.theme.textMain = e.target.value;
      applyTheme();
      saveState();
    });

    const presetSelect = document.getElementById("presetSelect");
    presetSelect.addEventListener("change", () => {
      const key = presetSelect.value;
      if (!key) return;
      const preset = themePresets[key];
      if (!preset) return;
      state.theme = { ...preset };
      applyTheme();
      renderEvents();
      saveState();
    });

    const alarmToggleEl = document.getElementById("alarmToggle");
    const alarmSoundSelect = document.getElementById("alarmSoundSelect");
    const alarmVolumeEl = document.getElementById("alarmVolume");
    const alarmStatusEl = document.getElementById("alarmStatus");

    let lastAlarmCheckMinute = null;

    const alarmAudio = new Audio();
    const alarmSounds = {
      chime: "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=",
      bell: "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=",
      ping: "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="
    };

    function playAlarm(message) {
      if (!state.alarmsEnabled) return;
      alarmAudio.src = alarmSounds[state.alarmSound] || alarmSounds.chime;
      alarmAudio.volume = state.alarmVolume;
      alarmAudio.play().catch(() => {});
      alarmStatusEl.textContent = message;
      setTimeout(() => {
        if (alarmStatusEl.textContent === message) {
          alarmStatusEl.textContent = "";
        }
      }, 10000);
    }

    alarmToggleEl.addEventListener("change", () => {
      state.alarmsEnabled = alarmToggleEl.checked;
      saveState();
    });

    alarmSoundSelect.addEventListener("change", () => {
      state.alarmSound = alarmSoundSelect.value;
      saveState();
    });

    alarmVolumeEl.addEventListener("input", () => {
      state.alarmVolume = parseFloat(alarmVolumeEl.value);
      saveState();
    });

    function checkAlarms() {
      const now = new Date();
      const minutesToday = now.getHours() * 60 + now.getMinutes();
      if (lastAlarmCheckMinute === minutesToday) return;
      lastAlarmCheckMinute = minutesToday;

      const template = getCurrentTemplate();
      if (!template) return;

      const events = [...template.events].sort((a, b) => a.startMinutes - b.startMinutes);

      for (let i = 0; i < events.length; i++) {
        const ev = events[i];
        const next = events[i + 1];

        if (clampTo5Minutes(ev.startMinutes) === clampTo5Minutes(minutesToday)) {
          playAlarm(`Start: ${ev.title}`);
        }

        if (clampTo5Minutes(ev.endMinutes) === clampTo5Minutes(minutesToday)) {
          if (next) {
            playAlarm(`"${ev.title}" finished, start "${next.title}"`);
          } else {
            playAlarm(`"${ev.title}" finished`);
          }
        }
      }
    }

    setInterval(checkAlarms, 15000);

    const currentTimeLabel = document.getElementById("currentTimeLabel");
    const currentEventLabel = document.getElementById("currentEventLabel");

    function updateCurrentTimeAndEvent() {
      const now = new Date();
      const minutesToday = now.getHours() * 60 + now.getMinutes();
      currentTimeLabel.textContent = minutesToTimeStr(minutesToday);

      const template = getCurrentTemplate();
      if (!template) {
        currentEventLabel.textContent = "No current event";
        return;
      }

      const ev = template.events.find(e => e.startMinutes <= minutesToday && e.endMinutes > minutesToday);
      if (ev) {
        currentEventLabel.textContent = ev.title;
      } else {
        currentEventLabel.textContent = "No current event";
      }
    }

    setInterval(updateCurrentTimeAndEvent, 30000);

    const templateModalBackdrop = document.getElementById("templateModalBackdrop");
    const templateNameInput = document.getElementById("templateNameInput");
    const duplicateTemplateBtn = document.getElementById("duplicateTemplateBtn");
    const deleteTemplateConfirmBtn = document.getElementById("deleteTemplateConfirmBtn");
    const cancelTemplateBtn = document.getElementById("cancelTemplateBtn");
    const saveTemplateBtn = document.getElementById("saveTemplateBtn");

    let editingTemplateId = null;

    function openTemplateModal(templateId) {
      const tpl = state.templates.find(t => t.id === templateId);
      if (!tpl) return;

      editingTemplateId = templateId;
      templateNameInput.value = tpl.name;

      templateModalBackdrop.classList.add("visible");
    }

    function closeTemplateModal() {
      templateModalBackdrop.classList.remove("visible");
      editingTemplateId = null;
    }

    cancelTemplateBtn.addEventListener("click", closeTemplateModal);

    templateModalBackdrop.addEventListener("click", (e) => {
      if (e.target === templateModalBackdrop) closeTemplateModal();
    });

    saveTemplateBtn.addEventListener("click", () => {
      const tpl = state.templates.find(t => t.id === editingTemplateId);
      if (!tpl) return;

      tpl.name = templateNameInput.value.trim() || "Untitled Template";

      saveState();
      renderTemplatesList();
      syncTemplateTitle();
      closeTemplateModal();
    });

    deleteTemplateConfirmBtn.addEventListener("click", () => {
      if (!editingTemplateId) return;

      if (state.templates.length <= 1) {
        alert("You must have at least one template.");
        return;
      }

      state.templates = state.templates.filter(t => t.id !== editingTemplateId);

      if (state.currentTemplateId === editingTemplateId) {
        state.currentTemplateId = state.templates[0].id;
      }

      saveState();
      renderTemplatesList();
      syncTemplateTitle();
      renderEvents();
      closeTemplateModal();
    });

    duplicateTemplateBtn.addEventListener("click", () => {
      const tpl = state.templates.find(t => t.id === editingTemplateId);
      if (!tpl) return;

      const newId = generateId("tpl");
      const cloned = {
        id: newId,
        name: tpl.name + " (Copy)",
        events: tpl.events.map(ev => ({
          ...ev,
          id: generateId("ev")
        }))
      };

      state.templates.push(cloned);
      state.currentTemplateId = newId;

      saveState();
      renderTemplatesList();
      syncTemplateTitle();
      renderEvents();
      closeTemplateModal();
    });

    function init() {
      loadState();
      applyTheme();
      renderHours();
      renderTemplatesList();
      syncTemplateTitle();
      renderEvents();

      toggleEarlyBtn.classList.toggle("active", state.showEarly);
      toggleEarlyBtn.textContent = state.showEarly
        ? "Hide 00:00–06:00 & 23:00–24:00"
        : "Show 00:00–06:00 & 23:00–24:00";

      alarmToggleEl.checked = state.alarmsEnabled;
      alarmSoundSelect.value = state.alarmSound;
      alarmVolumeEl.value = state.alarmVolume;

      updateCurrentTimeAndEvent();
      setTimeout(updateCurrentTimeAndEvent, 1000);

      document.getElementById("addTemplateBtn").addEventListener("click", addTemplate);
    }

    init();
  </script>
</body>
</html>
